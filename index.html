<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تخفيضات بيض البركة</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding-top:120px;
}

/* HEADER */

header{
background:linear-gradient(135deg,#ff6a00,#ffa726);
padding:20px;
text-align:center;
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
transition:all 0.3s ease;
}

header.scrolled{
padding:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

header img{
width:170px;
}

/* CART */

.cart-icon{
position:absolute;
right:20px;
top:20px;
font-size:36px;
cursor:pointer;
}

.cart-count{
background:red;
color:white;
padding:4px 8px;
border-radius:50%;
font-size:14px;
position:absolute;
top:-10px;
right:-10px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
text-align:center;
box-shadow:0 6px 15px rgba(0,0,0,0.15);
position:relative;
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

.add{
position:absolute;
right:12px;
top:140px;
background:#e9eef4;
border:none;
width:40px;
height:40px;
border-radius:10px;
font-size:24px;
cursor:pointer;
}

.name{
font-size:18px;
margin-top:10px;
}

.price{
font-size:20px;
font-weight:bold;
color:#2e7d32;
}

/* CART PANEL */

.cart-panel{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
max-height:60%;
overflow:auto;
display:none;
padding:20px;
box-shadow:0 -5px 20px rgba(0,0,0,0.2);
border-top-left-radius:20px;
border-top-right-radius:20px;
}

.item{
display:flex;
align-items:center;
margin-bottom:10px;
}

.item img{
width:60px;
height:60px;
margin-right:10px;
}

.total{
font-size:20px;
font-weight:bold;
color:#2e7d32;
margin-top:10px;
}

.order{
background:#25D366;
color:white;
border:none;
padding:14px;
border-radius:12px;
width:100%;
margin-top:10px;
font-size:18px;
}

/* MODAL */

.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
width:280px;
position:relative;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:22px;
cursor:pointer;
}

.modal-img{
width:120px;
height:120px;
object-fit:contain;
margin-bottom:10px;
}

.qty-btn{
width:45px;
height:45px;
border:none;
border-radius:10px;
font-size:22px;
background:#ff6a00;
color:white;
}

.qty-number{
font-size:24px;
margin:0 15px;
}

.add-cart{
margin-top:15px;
background:#25D366;
color:white;
border:none;
padding:12px;
border-radius:10px;
width:100%;
font-size:16px;
}

</style>

</head>

<body>

<header>

<img src="logo.png">

<div class="cart-icon" onclick="toggleCart()">
🛒
<span class="cart-count" id="count">0</span>
</div>

</header>

<div class="products" id="products"></div>

<div class="cart-panel" id="cartPanel">

<h3>سلة المشتريات</h3>

<div id="items"></div>

<div class="total" id="total"></div>

<button class="order" onclick="sendWhatsApp()">
إرسال الطلب عبر واتساب
</button>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<span class="close" onclick="closeModal()">✕</span>

<img id="modalImage" class="modal-img">

<h3 id="modalName"></h3>

<button class="qty-btn" onclick="changeQty(-1)">-</button>

<span class="qty-number" id="qty">1</span>

<button class="qty-btn" onclick="changeQty(1)">+</button>

<br><br>

<button class="add-cart" onclick="confirmAdd()">
إضافة إلى السلة
</button>

</div>

</div>

<script>

let sheetURL="https://docs.google.com/spreadsheets/d/13vbimBbsAQOqe_9_dTQNtLUQZObklkwj-3ggGg88ruo/export?format=csv";

let cart=[];
let selectedProduct=null;
let quantity=1;

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);

rows.forEach(row=>{

let cols=row.split(",");

let name=cols[0];
let price=parseFloat(cols[1]);
let image=cols[2];

if(name){

document.getElementById("products").innerHTML+=`

<div class="card">

<img src="${image}">

<button class="add"
data-name="${name}"
data-price="${price}"
data-image="${image}">+</button>

<div class="name">${name}</div>
<div class="price">${price} DH</div>

</div>`;

}

});

document.querySelectorAll(".add").forEach(btn=>{

btn.onclick=()=>{

selectedProduct={
name:btn.dataset.name,
price:parseFloat(btn.dataset.price),
image:btn.dataset.image
};

quantity=1;

document.getElementById("qty").innerText=quantity;

document.getElementById("modalName").innerText=selectedProduct.name;

document.getElementById("modalImage").src=selectedProduct.image;

document.getElementById("modal").style.display="flex";

};

});

});

function changeQty(n){

quantity+=n;

if(quantity<1) quantity=1;

document.getElementById("qty").innerText=quantity;

}

function confirmAdd(){

cart.push({
...selectedProduct,
qty:quantity
});

document.getElementById("modal").style.display="none";

updateCart();

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function updateCart(){

let html="";
let total=0;
let count=0;

cart.forEach(p=>{

total+=p.price*p.qty;
count+=p.qty;

html+=`
<div class="item">
<img src="${p.image}">
<div>${p.name}<br>${p.qty} × ${p.price} DH</div>
</div>`;

});

total+=10;

document.getElementById("items").innerHTML=html;

document.getElementById("total").innerText=
"المجموع + التوصيل: "+total+" DH";

document.getElementById("count").innerText=count;

}

function toggleCart(){

let c=document.getElementById("cartPanel");

c.style.display=c.style.display=="block"?"none":"block";

}

function sendWhatsApp(){

let phone="212627320807";

let msg="طلب جديد:%0A";

let total=0;

cart.forEach(p=>{

total+=p.price*p.qty;

msg+=`${p.name} - ${p.qty} × ${p.price} DH%0A`;

});

total+=10;

msg+="%0Aالتوصيل: 10 DH%0A";

msg+="المجموع: "+total+" DH";

window.open("https://wa.me/"+phone+"?text="+msg);

}

window.addEventListener("scroll",function(){

let header=document.querySelector("header");

if(window.scrollY>30){

header.classList.add("scrolled");

}else{

header.classList.remove("scrolled");

}

});

</script>

</body>
</html>
