<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تخفيضات بيض البركة</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

/* HEADER */

header{
background:linear-gradient(135deg,#ff6a00,#ffa726);
padding:20px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
position:sticky;
top:0;
z-index:100;
}

header img{
width:170px;
}

/* CART */

.cart-icon{
position:absolute;
right:20px;
top:20px;
font-size:36px;
cursor:pointer;
}

.cart-count{
background:red;
color:white;
font-size:14px;
padding:4px 8px;
border-radius:50%;
position:absolute;
top:-10px;
right:-10px;
}

/* GRID */

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

/* CARD */

.card{
background:white;
border-radius:18px;
padding:18px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
position:relative;
}

.card img{
width:100%;
height:220px;
object-fit:contain;
}

/* ADD BUTTON */

.add{
position:absolute;
right:12px;
top:150px;
background:#e9eef4;
border:none;
width:40px;
height:40px;
border-radius:10px;
font-size:24px;
color:#2b5c90;
}

/* TEXT */

.name{
font-size:18px;
margin-top:8px;
color:#2b5c90;
}

.price{
font-size:20px;
font-weight:bold;
color:#2e7d32;
}

/* CART PANEL */

.cart-panel{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
max-height:60%;
overflow:auto;
display:none;
box-shadow:0 -5px 20px rgba(0,0,0,0.2);
padding:20px;
border-top-left-radius:20px;
border-top-right-radius:20px;
}

.item{
display:flex;
align-items:center;
margin-bottom:10px;
}

.item img{
width:60px;
height:60px;
object-fit:contain;
margin-right:10px;
}

.total{
font-size:20px;
font-weight:bold;
color:#2e7d32;
margin-top:10px;
}

.order{
background:#25D366;
color:white;
border:none;
padding:14px;
border-radius:12px;
width:100%;
margin-top:10px;
font-size:18px;
}

</style>

</head>

<body>

<header>

<img src="logo.png">

<div class="cart-icon" onclick="toggleCart()">
🛒
<span class="cart-count" id="count">0</span>
</div>

</header>

<div class="products" id="products"></div>

<div class="cart-panel" id="cartPanel">

<h3>سلة المشتريات</h3>

<div id="items"></div>

<div class="total" id="total"></div>

<button class="order" onclick="sendWhatsApp()">
إرسال الطلب عبر واتساب
</button>

</div>

<script>

let sheetURL="https://docs.google.com/spreadsheets/d/13vbimBbsAQOqe_9_dTQNtLUQZObklkwj-3ggGg88ruo/export?format=csv";

let cart=[];

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);

rows.forEach(row=>{

let cols=row.split(",");

let name=cols[0];
let price=parseFloat(cols[1]);
let image=cols[2];

if(name){

document.getElementById("products").innerHTML+=
'<div class="card">'+
'<img src="'+image+'">'+
'<button class="add" onclick="addItem(\''+name+'\','+price+',\''+image+'\')">+</button>'+
'<div class="name">'+name+'</div>'+
'<div class="price">'+price+' DH</div>'+
'</div>';

}

});

});

function addItem(name,price,image){

let qty=prompt("كم العدد؟");

qty=parseInt(qty);

if(!qty) return;

cart.push({name:name,price:price,image:image,qty:qty});

updateCart();

}

function updateCart(){

let html="";
let total=0;
let count=0;

cart.forEach(p=>{

total+=p.price*p.qty;
count+=p.qty;

html+=
'<div class="item">'+
'<img src="'+p.image+'">'+
'<div>'+p.name+'<br>'+p.qty+' × '+p.price+' DH</div>'+
'</div>';

});

total+=10;

document.getElementById("items").innerHTML=html;

document.getElementById("total").innerText=
"المجموع + التوصيل: "+total+" DH";

document.getElementById("count").innerText=count;

}

function toggleCart(){

let c=document.getElementById("cartPanel");

c.style.display=c.style.display=="block"?"none":"block";

}

function sendWhatsApp(){

let phone="212627320807";

let msg="طلب جديد:%0A";

let total=0;

cart.forEach(p=>{

total+=p.price*p.qty;

msg+=p.name+" - "+p.qty+" × "+p.price+" DH%0A";

});

total+=10;

msg+="%0Aالتوصيل: 10 DH%0A";

msg+="المجموع: "+total+" DH";

window.open("https://wa.me/"+phone+"?text="+msg);

}

</script>

</body>
</html>
